# Use `docker compose --env-file .env.production -f deploy/docker-compose.yaml up --build`
# so APP_PORT interpolation for host port publishing stays aligned with .env.production.
services:
  be-vita-hot-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: be-vita-hot-engine
    env_file:
      - ../.env.production
    ports:
      - "${APP_PORT:-18000}:${APP_PORT:-18000}"
